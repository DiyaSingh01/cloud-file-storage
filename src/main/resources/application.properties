# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/filestoragedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# AWS S3 Configuration
aws.region=ap-south-1
aws.access-key=YOUR_AWS_ACCESS_KEY
aws.secret-key=YOUR_AWS_SECRET_KEY
aws.s3.bucket-name=your-file-storage-bucket

# Presigned URL expiry (in minutes)
aws.s3.presigned-url-expiry-minutes=60

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Allowed file types (comma-separated MIME types)
storage.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,application/json,application/zip,video/mp4,audio/mpeg

# Max file size per upload (bytes) - 50MB default
storage.max-file-size-bytes=52428800

# Logging
logging.level.com.filestorage=DEBUG
logging.level.software.amazon.awssdk=WARN
