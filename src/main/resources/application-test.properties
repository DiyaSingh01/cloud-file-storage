# Test profile - uses H2 in-memory DB, no real AWS calls
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dummy AWS values for tests (S3 is mocked)
aws.region=us-east-1
aws.access-key=test-key
aws.secret-key=test-secret
aws.s3.bucket-name=test-bucket
aws.s3.presigned-url-expiry-minutes=60

storage.allowed-mime-types=image/jpeg,image/png,application/pdf,text/plain
storage.max-file-size-bytes=52428800
